</script>
<style>
/* ═════════════ Theme tokens ═════════════ */
.theme-dark {
  --bg: #0F0F11; --tile: #161619; --line: #2A2A30; --axis: #3A3A41; --grid: #1F1F23;
  --ink: #F4F4F2; --ink-2: #C4C4C0; --muted: #85858C;
  --accent: #F2B84B; --accent-fill: #F2B84B; --accent-ink: #0F0F11; --accent-wash: rgba(242,184,75,.09);
  --pos: #6FD08C; --neg: #FF6B5B;
  --c-focus: #F2B84B; --c-base: #E6E4DE; --c-soft: #45454C;
  --total-bg: #F4F4F2; --total-ink: #0F0F11;
}
.theme-light {
  --bg: #FFFFFF; --tile: #F6F6F7; --line: #E6E6EA; --axis: #CFCFD5; --grid: #F0F0F2;
  --ink: #111114; --ink-2: #3F3F46; --muted: #74747C;
  --accent: #1F4FE0; --accent-fill: #2F5BFF; --accent-ink: #FFFFFF; --accent-wash: rgba(47,91,255,.06);
  --pos: #16A34A; --neg: #DC2626;
  --c-focus: #2F5BFF; --c-base: #111114; --c-soft: #C9C9CF;
  --total-bg: #111114; --total-ink: #FFFFFF;
}

/* ═════════════ Writing-style tokens ═════════════ */
.style-consulting {
  --h: 56px; --h-lh: 1.1; --h-w: 600; --h-track: -.02em; --h-max: 1500px;
  --body: 22px; --col-title: 28px; --stat: 80px; --statement: 84px; --body-gap: 48px;
}
.style-pitch {
  --h: 96px; --h-lh: 1.0; --h-w: 650; --h-track: -.035em; --h-max: 1600px;
  --body: 30px; --col-title: 38px; --stat: 112px; --statement: 132px; --body-gap: 88px;
}

/* ═════════════ Slide frame — shared by every template ═════════════ */
.slide {
  position: absolute; inset: 0 auto auto 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; transform: scale(var(--s, .5));
  background: var(--bg); color: var(--ink);
  font-family: "Geist", system-ui, sans-serif; font-size: var(--body);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum";
  padding: 120px 120px 80px; display: flex; flex-direction: column; overflow: hidden;
}
.chrome {
  position: absolute; top: 48px; left: 120px; right: 120px; display: flex; justify-content: space-between;
  font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.tracker { position: absolute; top: 80px; left: 120px; right: 120px; height: 1px; background: var(--line); }
.tracker i { display: block; height: 2px; margin-top: -.5px; background: var(--muted); }
.style-pitch .tracker, .style-pitch .chrome .deck { display: none; }

.kicker {
  font: 500 17px/1 "Geist Mono", monospace; letter-spacing: .16em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 24px;
}
.headline {
  font-size: var(--h); line-height: var(--h-lh); font-weight: var(--h-w); letter-spacing: var(--h-track);
  max-width: var(--h-max); text-wrap: balance;
}
.style-consulting .headline { padding-bottom: 36px; border-bottom: 1px solid var(--line); max-width: none; }
.style-consulting .headline span { display: block; max-width: var(--h-max); }
.body { flex: 1; min-height: 0; margin-top: var(--body-gap); display: grid; align-content: start; }
strong { font-weight: 600; color: var(--ink); }

/* Footer band: reserved in consulting so body height is identical deck-wide */
.foot-band { flex: none; }
.style-consulting .foot-band { height: 112px; display: flex; flex-direction: column; justify-content: flex-end; }
.takeaway { border-left: 3px solid var(--accent-fill); padding: 4px 0 4px 24px; font-size: 26px; font-weight: 500; line-height: 1.3; }
.source { margin-top: 18px; font: 400 15px/1.4 "Geist Mono", monospace; color: var(--muted); }
.style-pitch .takeaway { display: none; }

/* Pitch: short content floats to the optical centre instead of leaving dead space */
.style-pitch.slide:not(.t-cover) { justify-content: center; }
.style-pitch .body { flex: none; }
.style-pitch.t-split .body, .style-pitch.t-chart .body { height: 580px; }

/* ═════════════ Cover ═════════════ */
.t-cover { justify-content: flex-end; padding-bottom: 176px; }
.cover-title { font-size: 200px; line-height: .9; font-weight: 700; letter-spacing: -.055em; }
.cover-sub { margin-top: 36px; font-size: 40px; line-height: 1.25; color: var(--ink-2); max-width: 1300px; letter-spacing: -.01em; }
.style-consulting .cover-title { font-size: 168px; }
.style-consulting .cover-sub { font-size: 36px; }
.cover-meta {
  position: absolute; bottom: 64px; left: 120px; right: 120px; display: flex; justify-content: space-between;
  padding-top: 24px; border-top: 1px solid var(--line);
  font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

/* ═════════════ Statement ═════════════ */
.t-statement { justify-content: center; }
.t-statement .headline { font-size: var(--statement); line-height: 1.04; letter-spacing: -.035em; border: 0; padding: 0; }
.t-statement .headline span { max-width: 1640px; }
.t-statement .headline em { font-style: normal; color: var(--accent); }
.t-statement .body { flex: none; margin-top: 44px; }
.subtitle { font-size: 34px; line-height: 1.4; color: var(--ink-2); max-width: 1300px; }
.style-consulting.t-statement .foot-band { display: none; }

/* ═════════════ Split: ⅔ evidence + ⅓ commentary ═════════════ */
.t-split .body { grid-template-columns: 1fr 500px; gap: 56px; align-content: stretch; }
.main { min-height: 0; display: flex; flex-direction: column; }
.comments { display: flex; flex-direction: column; gap: 32px; padding-left: 40px; border-left: 1px solid var(--line); }
.style-pitch .comments { justify-content: center; gap: 48px; }
.comment { display: grid; grid-template-columns: 32px 1fr; gap: 18px; }
.marker {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-fill); color: var(--accent-ink); font: 600 16px/1 "Geist Mono", monospace;
}
.comment h4 { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; padding-top: 2px; }
.comment p { font-size: 21px; line-height: 1.4; color: var(--ink-2); margin-top: 8px; }
.style-pitch .comment h4 { font-size: 34px; line-height: 1.15; }

/* ═════════════ Columns 2–4 ═════════════ */
.cols { display: grid; }
.n-2 { grid-template-columns: repeat(2, 1fr); }
.n-3 { grid-template-columns: repeat(3, 1fr); }
.n-4 { grid-template-columns: repeat(4, 1fr); }
.col { display: flex; flex-direction: column; min-width: 0; }
.icon {
  width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
  background: var(--accent-wash); color: var(--accent);
}
.icon svg { width: 32px; height: 32px; stroke-width: 1.6; }
.col.neg .icon { background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); }
.col.pos .icon { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
.col .stat { font-size: var(--stat); font-weight: 650; line-height: 1; letter-spacing: -.045em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.n-4 .stat { font-size: calc(var(--stat) * .86); }
.col .label { margin-top: 36px; font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.col .stat + .label { margin-top: 16px; }
.col h3 { margin-top: 14px; font-size: var(--col-title); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.col .icon + h3 { margin-top: 36px; }
.col p, .col li { font-size: var(--body); line-height: 1.45; color: var(--ink-2); }
.col p { margin-top: 16px; }
.col ul { list-style: none; margin-top: 20px; display: grid; gap: 10px; }
.col li { padding-left: 24px; position: relative; }
.col li::before { content: ""; position: absolute; left: 2px; top: .66em; width: 8px; height: 1.5px; background: var(--muted); }
.col .foot { margin-top: auto; padding-top: 28px; }
.chip { display: inline-block; font: 400 16px/1.4 "Geist Mono", monospace; color: var(--muted); }

/* ═════════════ Table ═════════════ */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl th {
  font: 500 14px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  text-align: left; padding: 18px 20px; border-bottom: 1px solid var(--axis);
}
.tbl td { font-size: 24px; padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.tbl td:first-child, .tbl th:first-child { padding-left: 0; }
.tbl td:first-child { color: var(--ink); }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl td small { display: block; margin-top: 4px; font: 400 15px/1.3 "Geist Mono", monospace; color: var(--muted); }
.tbl tr.muted td { font-style: italic; color: var(--muted); }
.tbl .hl { background: var(--accent-wash); }
.tbl tr.total td { background: var(--total-bg); color: var(--total-ink); font-weight: 600; border: 0; padding: 16px 20px; }
.tbl tr.total td:first-child { border-radius: 10px 0 0 10px; padding-left: 20px; }
.tbl tr.total td:last-child { border-radius: 0 10px 10px 0; }
.style-pitch .tbl td small { display: none; }
.style-pitch .tbl td { font-size: 28px; padding: 16px 20px; }

/* ═════════════ Chart ═════════════ */
.t-chart .body { display: flex; }
.t-chart .main { flex: 1; }
.chart { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 24px; }
.lg { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; color: var(--ink-2); }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.sw.line { width: 22px; height: 3px; border-radius: 2px; }
.sw.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 11px); }
.plot { flex: 1; min-height: 0; }
.c-focus { --c: var(--c-focus); } .c-base { --c: var(--c-base); } .c-soft { --c: var(--c-soft); }
.grid { stroke: var(--grid); stroke-width: 1; }
.zero { stroke: var(--axis); stroke-width: 1.5; }
.tick { fill: var(--muted); font: 400 16px "Geist Mono", monospace; }
.cat { fill: var(--ink-2); font: 400 20px "Geist", sans-serif; }
.bar { fill: var(--c); rx: 3px; }
.line { fill: none; stroke: var(--c); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.line.c-base { stroke-width: 3; opacity: .65; }
.line.dashed { stroke-dasharray: 10 9; stroke-linecap: butt; }
.area { fill: var(--c); opacity: .05; }
.theme-dark .area { display: none; }
.dot { fill: var(--c); stroke: var(--bg); stroke-width: 4; }
.surface-cards .dot { stroke: var(--tile); }
.endlabel { fill: var(--c); font: 600 24px "Geist", sans-serif; }
.mk { fill: var(--accent-fill); }
.mk-t { fill: var(--accent-ink); font: 600 16px "Geist Mono", monospace; text-anchor: middle; dominant-baseline: central; }
.leader { stroke: var(--accent-fill); stroke-width: 1.5; }

/* ═════════════ Surface A — Hairline (default, closest to the reference decks) ═════════════ */
.surface-hairline .col + .col { padding-left: 40px; border-left: 1px solid var(--line); }
.surface-hairline .col { padding-right: 40px; }
.surface-hairline .cols:has(.pos) { gap: 40px; }
.surface-hairline .cols:has(.pos) .col { padding: 36px 40px; border: 1px solid transparent; border-radius: 16px; }
.surface-hairline .cols:has(.pos) .col.neg { padding-left: 0; }
.surface-hairline .col.pos { border-color: color-mix(in srgb, var(--pos) 40%, var(--line)); }

/* ═════════════ Surface B — Cards (modern product-UI pattern) ═════════════ */
.surface-cards .cols { gap: 20px; }
.surface-cards .col, .surface-cards .main, .surface-cards .comments, .surface-cards .tbl-wrap {
  background: var(--tile); border: 1px solid var(--line); border-radius: 20px;
}
.surface-cards .col { padding: 40px; }
.surface-cards .col.pos { border-color: color-mix(in srgb, var(--pos) 40%, var(--line)); }
.surface-cards .main { padding: 36px 40px 24px; }
.surface-cards .comments { padding: 40px; }
.surface-cards .tbl-wrap { padding: 8px 32px 20px; }
.surface-cards.t-split .body { gap: 20px; }
.surface-cards .icon { background: var(--bg); }

/* ═════════════ Review page chrome (not part of the product) ═════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #E7E7E5; color: #18181B; font-family: "Geist", system-ui, sans-serif; }
body.page-dark { background: #09090A; color: #EDEDEA; }
.top {
  position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between;
  padding: 18px 32px; backdrop-filter: blur(16px); background: rgba(231,231,229,.85); border-bottom: 1px solid rgba(0,0,0,.08);
}
.page-dark .top { background: rgba(9,9,10,.85); border-color: rgba(255,255,255,.08); }
.top h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.top p { font-size: 14px; opacity: .6; margin-top: 3px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.07); }
.page-dark .seg { background: rgba(255,255,255,.08); }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: .65; }
.seg button[aria-pressed="true"] { background: #fff; color: #18181B; opacity: 1; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid #2F5BFF; outline-offset: 2px; }
main { max-width: 1480px; margin: 0 auto; padding: 32px 32px 120px; display: grid; gap: 56px; }
figure { display: grid; gap: 14px; }
figcaption { display: flex; gap: 14px; align-items: baseline; }
figcaption .id { font: 500 13px/1 "Geist Mono", monospace; opacity: .5; }
figcaption b { font-size: 16px; font-weight: 600; }
.frames { display: grid; gap: 20px; }
.frames.two { grid-template-columns: 1fr 1fr; }
.frame-wrap { display: grid; gap: 8px; }
.frame-label { font: 500 12px/1 "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px -12px rgba(0,0,0,.25); }
details { font-size: 13px; }
details summary { cursor: pointer; opacity: .6; font-weight: 500; }
details pre { margin-top: 10px; padding: 16px 18px; border-radius: 12px; overflow: auto; max-height: 360px; font: 12.5px/1.55 "Geist Mono", monospace; background: rgba(0,0,0,.06); }
.page-dark details pre { background: rgba(255,255,255,.06); }
@media (max-width: 900px) { .frames.two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Slide system · proposal v2</h1>
    <p>One component set · two writing styles · two surfaces · two themes. Every slide is rendered from the JSON under it.</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Writing style">
      <button data-k="style" data-v="both">Side by side</button>
      <button data-k="style" data-v="consulting">Consulting</button>
      <button data-k="style" data-v="pitch">Pitch</button>
    </div>
    <div class="seg" role="group" aria-label="Surface">
      <button data-k="surface" data-v="hairline">Hairline</button>
      <button data-k="surface" data-v="cards">Cards</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-k="theme" data-v="dark">Dark</button>
      <button data-k="theme" data-v="light">Light</button>
    </div>
  </div>
</header>
<main id="list"></main>

<script>
/* ═════════════ Renderer: frame + body layouts + slot kinds ═════════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/&lt;(\/?)em&gt;/g, "<$1em>");
const pad2 = n => String(n).padStart(2, "0");

function specFor(slide, style) {
  const { consulting, pitch, name, ...shared } = slide;
  return { ...shared, ...(style === "pitch" ? pitch : consulting) };
}

function colHTML(c) {
  return `<div class="col ${c.tone || ""}">
    ${c.icon ? `<div class="icon"><i data-lucide="${c.icon}"></i></div>` : ""}
    ${c.stat ? `<div class="stat">${esc(c.stat)}</div>` : ""}
    ${c.label ? `<div class="label">${esc(c.label)}</div>` : ""}
    ${c.title ? `<h3>${md(c.title)}</h3>` : ""}
    ${c.text ? `<p>${md(c.text)}</p>` : ""}
    ${c.bullets ? `<ul>${c.bullets.map(b => `<li>${md(b)}</li>`).join("")}</ul>` : ""}
    ${c.chip ? `<div class="foot"><span class="chip">${md(c.chip)}</span></div>` : ""}
  </div>`;
}

function tableHTML(t) {
  const cell = (c, i) => {
    const col = t.columns[i], v = typeof c === "object" ? c : { v: c };
    return `<td class="${col.num ? "num" : ""} ${col.hl ? "hl" : ""}">${esc(v.v)}${v.sub ? `<small>${esc(v.sub)}</small>` : ""}</td>`;
  };
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${t.columns.map(c => `<th class="${c.num ? "num" : ""} ${c.hl ? "hl" : ""}">${esc(c.label)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr class="${r.style || ""}">${r.cells.map(cell).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function bodyHTML(s) {
  switch (s.template) {
    case "statement": return s.subtitle ? `<p class="subtitle">${md(s.subtitle)}</p>` : "";
    case "split": return `
      <div class="main"><div class="chart" data-chart></div></div>
      <aside class="comments">${s.comments.map((c, i) => `
        <div class="comment"><span class="marker">${i + 1}</span>
          <div><h4>${md(c.title)}</h4>${c.text ? `<p>${md(c.text)}</p>` : ""}</div></div>`).join("")}
      </aside>`;
    case "columns": return `<div class="cols n-${s.columns.length}">${s.columns.map(colHTML).join("")}</div>`;
    case "table": return tableHTML(s.table);
    case "chart": return `<div class="main"><div class="chart" data-chart></div></div>`;
  }
  return "";
}

function slideHTML(s, i, total) {
  if (s.template === "cover") return `<section class="slide t-cover">
      <div class="kicker">${md(s.kicker)}</div>
      <h1 class="cover-title">${esc(s.title)}</h1>
      <p class="cover-sub">${md(s.subtitle)}</p>
      <footer class="cover-meta">${s.meta.map(m => `<span>${esc(m)}</span>`).join("")}</footer>
    </section>`;
  return `<section class="slide t-${s.template}">
    <header class="chrome"><span class="deck">${DECK}</span><span>${pad2(i + 1)}</span></header>
    <div class="tracker"><i style="width:${((i + 1) / total) * 100}%"></i></div>
    ${s.kicker ? `<div class="kicker">${md(s.kicker)}</div>` : ""}
    <h2 class="headline"><span>${md(s.title)}</span></h2>
    <div class="body">${bodyHTML(s)}</div>
    <div class="foot-band">
      ${s.takeaway ? `<p class="takeaway">${md(s.takeaway)}</p>` : ""}
      ${s.source ? `<p class="source">Source: ${md(s.source)}</p>` : ""}
    </div>
  </section>`;
}

/* ═════════════ Chart: bar / line / combo, dual axis, anchored markers ═════════════ */
function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
const fmt = (tpl, v) => tpl.replace("{v}", Number.isInteger(v) ? v : v.toFixed(1));

function drawChart(host, spec) {
  host.innerHTML = `<div class="legend">${spec.series.map(s =>
    `<span class="lg c-${s.color}"><i class="sw ${s.kind} ${s.dashed ? "dashed" : ""}"></i>${esc(s.name)}</span>`).join("")}</div><div class="plot"></div>`;
  const box = host.querySelector(".plot"), W = box.clientWidth, H = box.clientHeight;
  const L = spec.series.filter(s => s.axis !== "right"), R = spec.series.filter(s => s.axis === "right");
  const lMax = Math.max(...L.flatMap(s => s.values)), lStep = niceStep(lMax / 4), count = Math.ceil(lMax / lStep);
  const scale = { left: { max: lStep * count, step: lStep } };
  if (R.length) { const rs = niceStep(Math.max(...R.flatMap(s => s.values)) / count); scale.right = { max: rs * count, step: rs }; }
  const markers = spec.markers || [];
  const P = { t: markers.length ? 60 : 16, r: R.length ? 72 : spec.endLabels ? 110 : 8, b: 48, l: 76 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b, n = spec.categories.length, band = pw / n;
  const y = (v, a = "left") => P.t + ph - (v / scale[a].max) * ph;
  const xc = i => P.l + band * i + band / 2;
  const bars = spec.series.filter(s => s.kind === "bar");
  const gw = band * (bars.length > 1 ? 0.56 : 0.42), bw = gw / Math.max(bars.length, 1);
  const pos = [];
  let g = "";

  for (let k = 0; k <= count; k++) {
    const yy = y(scale.left.step * k);
    g += `<line class="${k ? "grid" : "zero"}" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${P.l - 16}" y="${yy + 5}" text-anchor="end">${fmt(spec.axes.left, scale.left.step * k)}</text>`;
    if (scale.right) g += `<text class="tick" x="${W - P.r + 16}" y="${yy + 5}">${fmt(spec.axes.right, scale.right.step * k)}</text>`;
  }
  spec.categories.forEach((c, i) => g += `<text class="cat" x="${xc(i)}" y="${P.t + ph + 36}" text-anchor="middle">${esc(c)}</text>`);

  spec.series.forEach((s, si) => {
    if (s.kind !== "bar") return;
    const a = s.axis === "right" ? "right" : "left", j = bars.indexOf(s);
    pos[si] = s.values.map((v, i) => {
      const x = xc(i) - gw / 2 + j * bw + 2, top = y(v, a);
      g += `<rect class="bar c-${s.color}" x="${x}" y="${top}" width="${bw - 4}" height="${Math.max(y(0, a) - top, 0)}"/>`;
      return [x + (bw - 4) / 2, top];
    });
  });
  spec.series.forEach((s, si) => {
    if (s.kind !== "line") return;
    const a = s.axis === "right" ? "right" : "left";
    const pts = s.values.map((v, i) => [xc(i), y(v, a)]);
    pos[si] = pts;
    const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join("");
    if (s.area) g += `<path class="area c-${s.color}" d="${d}L${pts.at(-1)[0]},${y(0)}L${pts[0][0]},${y(0)}Z"/>`;
    g += `<path class="line c-${s.color} ${s.dashed ? "dashed" : ""}" d="${d}"/>`;
    const [lx, ly] = pts.at(-1);
    g += `<circle class="dot c-${s.color}" cx="${lx}" cy="${ly}" r="8"/>`;
    if (spec.endLabels) g += `<text class="endlabel c-${s.color}" x="${lx + 20}" y="${ly + 8}">${fmt(spec.axes.left, s.values.at(-1))}</text>`;
  });
  markers.forEach(m => {
    const [px, py] = pos[m.series][m.index], cy = py - 38;
    g += `<line class="leader" x1="${px}" x2="${px}" y1="${cy + 16}" y2="${py - 6}"/>`;
    g += `<circle class="mk" cx="${px}" cy="${cy}" r="16"/><text class="mk-t" x="${px}" y="${cy + 1}">${m.n}</text>`;
  });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ═════════════ Review page ═════════════ */
const q = new URLSearchParams(location.search);
const state = { style: q.get("style") || "both", surface: q.get("surface") || "hairline", theme: q.get("theme") || "dark" };
const list = document.getElementById("list");

function render() {
  document.body.className = state.theme === "dark" ? "page-dark" : "";
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", state[b.dataset.k] === b.dataset.v));
  const styles = state.style === "both" ? ["consulting", "pitch"] : [state.style];
  list.innerHTML = SLIDES.map((sl, i) => `
    <figure data-i="${i}">
      <figcaption><span class="id">${pad2(i + 1)} · ${sl.template}</span><b>${sl.name}</b></figcaption>
      <div class="frames ${styles.length > 1 ? "two" : ""}">${styles.map(st => `
        <div class="frame-wrap">${styles.length > 1 ? `<div class="frame-label">${st}</div>` : ""}
          <div class="frame" data-style="${st}"></div></div>`).join("")}</div>
      <details><summary>Agent output (JSON)</summary>
        <pre>${esc(JSON.stringify(styles.length > 1 ? sl : specFor(sl, styles[0]), null, 2))}</pre></details>
    </figure>`).join("");

  list.querySelectorAll("figure").forEach(fig => {
    const i = +fig.dataset.i;
    fig.querySelectorAll(".frame").forEach(fr => {
      const spec = specFor(SLIDES[i], fr.dataset.style);
      fr.innerHTML = slideHTML(spec, i, SLIDES.length);
      fr.firstElementChild.classList.add(`theme-${state.theme}`, `style-${fr.dataset.style}`, `surface-${state.surface}`);
      const host = fr.querySelector("[data-chart]");
      if (host) drawChart(host, { ...spec.chart, markers: spec.markers });
      ro.observe(fr);
    });
  });
  lucide.createIcons({ attrs: { "stroke-width": 1.6 } });
}

const ro = new ResizeObserver(entries => entries.forEach(e =>
  e.target.firstElementChild?.style.setProperty("--s", e.contentRect.width / 1920)));

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  state[b.dataset.k] = b.dataset.v;
  render();
}));

document.fonts.ready.then(render);
</script>
</body>
</html>
