<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../v5/slides.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=block" rel="stylesheet"></head>
<body><div id="frame" class="frame"></div>
<script type="module">
import { mountSlide } from "../../v5/render.js";
import { fitIssues, layoutLints } from "../../v5/lints.js";
const fonts = Promise.all(["800 100px Archivo", "900 100px Archivo", "400 30px Geist", "600 30px Geist", "500 20px 'Geist Mono'"].map((f) => document.fonts.load(f))).then(() => document.fonts.ready);
window.lint = async (slide, style) => {
  await fonts;
  const deck = { style, theme: "ink", footer: "Fixture", slides: [slide] };
  const el = mountSlide(document.getElementById("frame"), slide, { page: 1, section: 0, kicker: "", footer: "Fixture" }, deck);
  const body = el.querySelector(":scope > .head + *"), k = el.getBoundingClientRect().width / 1920;
  const bodyTop = body && Math.round((body.getBoundingClientRect().top - el.getBoundingClientRect().top) / k);
  return { fit: fitIssues(el, style), ...layoutLints(el, style), bodyTop };
};
window.ready = true;
</script>
<style>body { margin: 0; } .frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }</style>
</body></html>
