<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>SmartChart · Journey prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=block" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../v5/slides.css" />
<link rel="stylesheet" href="journey.css" />
</head>
<body>
<header class="bar">
  <div class="brand"><b>SmartChart</b><span>Journey prototype</span></div>
  <div class="bar-mid">
    <div class="seg" id="style" role="group" aria-label="Deck style">
      <button data-v="consulting">Consulting</button><button data-v="pitch">Pitch</button>
    </div>
    <div class="seg" id="theme" role="group" aria-label="Palette">
      <button data-v="ink">Ink</button><button data-v="paper">Paper</button>
    </div>
  </div>
  <div class="bar-end">
    <span class="mode" id="mode"></span>
    <select id="replay" class="pick" aria-label="Recorded run" hidden></select>
    <select id="decks" class="pick" aria-label="Deck" hidden></select>
    <button class="ghost" id="delete" hidden>Delete</button>
    <button class="ghost" id="reset">New deck</button>
    <button class="primary" id="present" disabled>Present <kbd>F</kbd></button>
  </div>
</header>

<div class="app">
  <aside class="chat">
    <div class="thread" id="thread"></div>
    <form class="composer" id="composer">
      <div class="chips" id="chips"></div>
      <textarea id="input" rows="3" placeholder="Describe a slide, or ask for a change…"></textarea>
      <div class="composer-row">
        <span class="hint" id="hint">Enter to send · Shift+Enter for a new line</span>
        <button class="ghost" id="clear" type="button">Clear chat</button>
        <button class="primary" id="send" type="submit">Send</button>
      </div>
    </form>
  </aside>

  <main class="stage">
    <div class="canvas-wrap"><div class="canvas" id="canvas" title="Present (F)"><div class="empty" id="empty">
      <p>Your slide appears here.</p><span>Pick a style, then describe what the slide should say.</span>
    </div></div></div>
    <section class="below">
      <div class="checks" id="checks"></div>
      <div class="strip" id="strip"></div>
    </section>
  </main>
</div>

<div class="measure" id="measure" aria-hidden="true"></div>
<div class="present" id="presentation" hidden><div class="present-frame" id="pframe"></div><div class="present-count" id="pcount"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
