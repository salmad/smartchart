<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slide system — proposal v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ───────────────────────── Theme tokens ───────────────────────── */
.theme-dark {
  --bg: #0F0F11; --tile: #17171A; --tile-2: #1D1D21; --border: #26262B; --line: #2E2E34;
  --ink: #F4F4F2; --ink-2: #C9C9C6; --muted: #8B8B92;
  --accent: #F2B84B; --accent-ink: #0F0F11; --accent-wash: rgba(242,184,75,.10);
  --pos: #6FD08C; --neg: #FF6B5B;
  --c-focus: #F2B84B; --c-base: #E6E4DE; --c-soft: #4A4A51;
  --grid: #222226; --axis: #3A3A41;
  --total-bg: #F4F4F2; --total-ink: #0F0F11;
}
.theme-light {
  --bg: #F4F4F5; --tile: #FFFFFF; --tile-2: #FAFAFA; --border: #E4E4E7; --line: #E4E4E7;
  --ink: #18181B; --ink-2: #3F3F46; --muted: #71717A;
  --accent: #2F5BFF; --accent-ink: #FFFFFF; --accent-wash: rgba(47,91,255,.07);
  --pos: #16A34A; --neg: #DC2626;
  --c-focus: #2F5BFF; --c-base: #18181B; --c-soft: #D4D4D8;
  --grid: #EFEFF1; --axis: #D4D4D8;
  --total-bg: #18181B; --total-ink: #FFFFFF;
}

/* ───────────────────────── Style tokens (density) ───────────────────────── */
.style-consulting {
  --h: 54px; --h-w: 600; --h-lh: 1.12; --h-track: -0.022em;
  --body: 24px; --col-title: 30px; --stat: 76px; --statement: 84px;
  --body-gap: 48px;
}
.style-pitch {
  --h: 84px; --h-w: 650; --h-lh: 1.02; --h-track: -0.035em;
  --body: 30px; --col-title: 38px; --stat: 112px; --statement: 132px;
  --body-gap: 64px;
}

/* ───────────────────────── Slide frame (shared by every template) ───────────────────────── */
.slide {
  position: absolute; inset: 0 auto auto 0;
  width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--s, .5));
  background: var(--bg); color: var(--ink);
  font-family: "Geist", system-ui, sans-serif; font-size: var(--body);
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "tnum";
  padding: 132px 112px 72px; display: flex; flex-direction: column; overflow: hidden;
}
.chrome {
  position: absolute; top: 52px; left: 112px; right: 112px;
  display: flex; justify-content: space-between; align-items: center;
  font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.chrome .deck { display: flex; align-items: center; gap: 14px; }
.chrome .deck::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.kicker {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
  font: 500 16px/1 "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-2); padding: 10px 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--tile);
  margin-bottom: 28px;
}
.kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.headline {
  font-weight: var(--h-w); font-size: var(--h); line-height: var(--h-lh); letter-spacing: var(--h-track);
  max-width: 1640px; text-wrap: balance;
}
.body { flex: 1; min-height: 0; margin-top: var(--body-gap); display: grid; }
.takeaway {
  margin-top: 32px; display: flex; align-items: center; gap: 18px;
  font-size: 26px; font-weight: 500; color: var(--ink);
}
.takeaway::before {
  content: "→"; flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}
.takeaway strong { color: var(--accent); font-weight: 600; }
.source { margin-top: 18px; font: 400 15px/1.4 "Geist Mono", monospace; color: var(--muted); }
strong { font-weight: 600; color: var(--ink); }

.tile { background: var(--tile); border: 1px solid var(--border); border-radius: 28px; }

/* ───────────────────────── Template: cover ───────────────────────── */
.t-cover { justify-content: flex-end; padding-bottom: 150px; }
.t-cover::after {
  content: ""; position: absolute; right: -240px; top: -320px; width: 1100px; height: 1100px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--accent-wash), transparent 70%); pointer-events: none;
}
.cover-title { font-weight: 700; font-size: 220px; line-height: .9; letter-spacing: -.055em; }
.cover-sub { margin-top: 36px; font-size: 44px; line-height: 1.25; color: var(--ink-2); max-width: 1300px; letter-spacing: -.01em; }
.style-consulting .cover-title { font-size: 180px; }
.style-consulting .cover-sub { font-size: 38px; }
.cover-meta {
  position: absolute; bottom: 60px; left: 112px; right: 112px; display: flex; justify-content: space-between;
  font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

/* ───────────────────────── Template: statement ───────────────────────── */
.t-statement { justify-content: center; }
.t-statement .headline { font-size: var(--statement); line-height: 1.02; letter-spacing: -.04em; max-width: 1640px; }
.style-consulting .t-statement .headline { letter-spacing: -.03em; line-height: 1.08; }
.t-statement .body { flex: none; display: block; margin-top: 44px; }
.subtitle { font-size: 34px; line-height: 1.4; color: var(--ink-2); max-width: 1300px; }
.t-statement .headline em { font-style: normal; color: var(--accent); }

/* ───────────────────────── Template: split (⅔ evidence + ⅓ commentary) ───────────────────────── */
.t-split .body { grid-template-columns: 1fr 520px; gap: 28px; }
.main { padding: 40px 44px 28px; min-height: 0; display: flex; flex-direction: column; }
.comments { padding: 44px 40px; display: flex; flex-direction: column; gap: 36px; min-height: 0; }
.comments-label { font: 500 14px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.comment { display: grid; grid-template-columns: 40px 1fr; gap: 20px; }
.marker {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font: 600 18px/1 "Geist Mono", monospace;
}
.comment h4 { font-size: 27px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; padding-top: 5px; }
.comment p { font-size: 22px; line-height: 1.45; color: var(--ink-2); margin-top: 10px; }
.style-pitch .comment h4 { font-size: 34px; }
.style-pitch .comments { justify-content: center; gap: 56px; }

/* ───────────────────────── Template: columns (2–4) ───────────────────────── */
.cols { display: grid; gap: 24px; }
.n-2 { grid-template-columns: repeat(2, 1fr); }
.n-3 { grid-template-columns: repeat(3, 1fr); }
.n-4 { grid-template-columns: repeat(4, 1fr); }
.col { padding: 44px 44px 40px; display: flex; flex-direction: column; min-height: 0; }
.icon {
  width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
  background: var(--accent-wash); color: var(--accent);
}
.icon svg { width: 36px; height: 36px; stroke-width: 1.6; }
.col.neg .icon { background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); }
.col.pos .icon { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
.col.pos { border-color: color-mix(in srgb, var(--pos) 45%, var(--border)); }
.col .stat { font-size: var(--stat); font-weight: 650; line-height: 1; letter-spacing: -.045em; color: var(--ink); }
.col .label { margin-top: 40px; font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.col .stat + .label { margin-top: 20px; }
.col h3 { margin-top: 16px; font-size: var(--col-title); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.col .icon + h3 { margin-top: 40px; }
.col p, .col li { font-size: var(--body); line-height: 1.45; color: var(--ink-2); }
.col p { margin-top: 18px; }
.col ul { list-style: none; margin-top: 22px; display: grid; gap: 14px; }
.col li { padding-left: 26px; position: relative; }
.col li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 2px; border-radius: 1px; background: var(--muted); }
.col .foot { margin-top: auto; padding-top: 28px; }
.chip {
  display: inline-flex; gap: 10px; align-items: center; padding: 10px 16px; border-radius: 12px;
  background: var(--tile-2); border: 1px solid var(--border); font-size: 19px; color: var(--ink-2);
}
.style-pitch .col { justify-content: flex-start; }

/* ───────────────────────── Template: table ───────────────────────── */
.tbl-wrap { padding: 20px 36px 24px; min-height: 0; overflow: hidden; align-self: start; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  font: 500 14px/1 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  text-align: left; padding: 20px 20px 18px; border-bottom: 1px solid var(--line);
}
.tbl td { font-size: 23px; padding: 15px 20px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.tbl td:first-child { color: var(--ink); }
.tbl .num { text-align: right; font-feature-settings: "tnum"; white-space: nowrap; }
.tbl td small { display: block; margin-top: 5px; font: 400 15px/1.3 "Geist Mono", monospace; color: var(--muted); }
.tbl tr.muted td { font-style: italic; color: var(--muted); }
.tbl tr.total td { border-bottom: 0; font-weight: 600; color: var(--ink); padding-top: 22px; }
.tbl tr.total .num span {
  display: inline-block; min-width: 96px; padding: 8px 14px; border-radius: 10px; text-align: center;
  background: var(--total-bg); color: var(--total-ink);
}
.tbl th.hl, .tbl td.hl { background: var(--accent-wash); }
.style-pitch .tbl td small { display: none; }
.style-pitch .tbl td { font-size: 28px; padding: 18px 20px; }

/* ───────────────────────── Template: chart ───────────────────────── */
.t-chart .body { display: flex; }
.t-chart .main { flex: 1; }

/* ───────────────────────── Chart component ───────────────────────── */
.chart { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.lg {
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border); font: 500 16px/1 "Geist", sans-serif; color: var(--ink-2);
}
.sw { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.sw.line { width: 22px; height: 4px; border-radius: 2px; }
.sw.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 11px); }
.plot { flex: 1; min-height: 0; }
.c-focus { --c: var(--c-focus); } .c-base { --c: var(--c-base); } .c-soft { --c: var(--c-soft); }
svg text { font-family: "Geist Mono", monospace; }
.grid { stroke: var(--grid); stroke-width: 1.5; }
.zero { stroke: var(--axis); stroke-width: 2; }
.tick { fill: var(--muted); font-size: 17px; }
.cat { fill: var(--ink-2); font-size: 18px; }
.bar { fill: var(--c); rx: 6px; }
.line { fill: none; stroke: var(--c); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.line.dashed { stroke-dasharray: 12 10; stroke-linecap: butt; }
.area { fill: var(--c); opacity: .08; }
.dot { fill: var(--c); stroke: var(--tile); stroke-width: 4; }
.endlabel { fill: var(--c); font-size: 22px; font-weight: 600; }
.mk { fill: var(--accent); }
.mk-t { fill: var(--accent-ink); font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.leader { stroke: var(--accent); stroke-width: 2; }

/* ───────────────────────── Review page chrome (not part of the product) ───────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #E7E7E5; color: #18181B; font-family: "Geist", system-ui, sans-serif; }
body.page-dark { background: #09090A; color: #EDEDEA; }
.top {
  position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between;
  padding: 18px 32px; backdrop-filter: blur(16px); background: color-mix(in srgb, currentColor 0%, rgba(231,231,229,.8));
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.page-dark .top { background: rgba(9,9,10,.8); border-color: rgba(255,255,255,.08); }
.top h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.top p { font-size: 14px; opacity: .6; margin-top: 3px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.07); }
.page-dark .seg { background: rgba(255,255,255,.08); }
.seg button {
  all: unset; cursor: pointer; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: .65;
}
.seg button[aria-pressed="true"] { background: #fff; color: #18181B; opacity: 1; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid #2F5BFF; outline-offset: 2px; }
main { max-width: 1480px; margin: 0 auto; padding: 32px 32px 120px; display: grid; gap: 56px; }
figure { display: grid; gap: 14px; }
figcaption { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
figcaption .id { font: 500 13px/1 "Geist Mono", monospace; opacity: .5; }
figcaption b { font-size: 16px; font-weight: 600; }
figcaption span { font-size: 14px; opacity: .6; }
.frames { display: grid; gap: 20px; }
.frames.two { grid-template-columns: 1fr 1fr; }
.frame-wrap { display: grid; gap: 8px; }
.frame-label { font: 500 12px/1 "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px -12px rgba(0,0,0,.25); }
details { font-size: 13px; }
details summary { cursor: pointer; opacity: .6; font-weight: 500; }
details pre {
  margin-top: 10px; padding: 16px 18px; border-radius: 12px; overflow: auto; max-height: 360px;
  font: 12.5px/1.55 "Geist Mono", monospace; background: rgba(0,0,0,.06);
}
.page-dark details pre { background: rgba(255,255,255,.06); }
.intro { max-width: 900px; font-size: 15px; line-height: 1.6; opacity: .8; }
.intro code { font-family: "Geist Mono", monospace; font-size: 13px; }
@media (max-width: 900px) { .frames.two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .frame { transition: box-shadow .2s ease; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Slide system · proposal v1</h1>
    <p>One component set · two writing styles · two themes. Every slide below is rendered from the JSON under it.</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Writing style">
      <button data-style="both" aria-pressed="true">Side by side</button>
      <button data-style="consulting" aria-pressed="false">Consulting</button>
      <button data-style="pitch" aria-pressed="false">Pitch</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-theme="dark" aria-pressed="true">Dark</button>
      <button data-theme="light" aria-pressed="false">Light</button>
    </div>
  </div>
</header>
<main id="list"></main>

<script>
/* ───────────── Slide specs: this is everything the agent would write ─────────────
   Shared fields live at the top level; `consulting` / `pitch` hold the copy for each writing style. */
const DECK = "FinBridge";

const SLIDES = [
  {
    template: "cover", name: "Cover",
    consulting: { kicker: "Investor memorandum · September 2026", title: "FinBridge", subtitle: "A revolving credit card and business account for UK SMEs with £0.5–10m turnover", meta: ["Seed round", "Confidential"] },
    pitch: { kicker: "Seed · 2026", title: "FinBridge", subtitle: "The credit card that runs a small business.", meta: ["Seed round", "finbridge.co"] },
  },
  {
    template: "statement", name: "Statement", section: "Problem",
    consulting: { kicker: "1 · The problem", title: "UK small businesses fund growth on <em>personal</em> credit cards because no provider bundles business credit with daily banking", subtitle: "Founders carry the personal guarantee and the limit risk, and £540k of annual spend earns nothing back for the business." },
    pitch: { kicker: "The problem", title: "Small businesses run on their founder’s <em>personal</em> Amex.", subtitle: "Three logins. One personal guarantee. Nothing back." },
  },
  {
    template: "split", name: "Split · chart + commentary", section: "Economics",
    chart: {
      categories: ["Year 1", "Year 2", "Year 3", "Year 4", "Year 5"],
      axes: { left: "£{v}m", right: "{v}%" },
      series: [
        { name: "Interest income", kind: "bar", color: "soft", values: [0.4, 3.1, 14, 42, 85] },
        { name: "Interchange", kind: "bar", color: "focus", values: [0.3, 2.2, 11, 36, 80] },
        { name: "Gross margin", kind: "line", color: "base", axis: "right", values: [12, 24, 31, 36, 38] },
      ],
    },
    consulting: {
      kicker: "3 · Unit economics",
      title: "Interchange catches up with interest by year 4, lifting gross margin from 12% to 38%",
      markers: [{ n: 1, series: 0, index: 1 }, { n: 2, series: 1, index: 3 }, { n: 3, series: 2, index: 4 }],
      comments: [
        { title: "Interest leads early", text: "Revolvers are **40–60%** of customers and carry margin while spend ramps." },
        { title: "Interchange compounds", text: "Spend per customer grows **3×** as the card replaces the founder’s personal Amex." },
        { title: "Margin settles at 38%", text: "Bad debt stabilises near **10%** of revolver balances from year 4." },
      ],
      takeaway: "Two revenue engines make the book profitable **without relying on APR alone**.",
      source: "FinBridge financial model, base case. Illustrative.",
    },
    pitch: {
      kicker: "Economics",
      title: "Two engines. 38% margin by year 5.",
      markers: [{ n: 1, series: 1, index: 3 }, { n: 2, series: 2, index: 4 }],
      comments: [
        { title: "Interchange matches interest by year 4" },
        { title: "Margin triples to 38%" },
      ],
    },
  },
  {
    template: "columns", name: "Columns · 3 with icons", section: "Solution",
    consulting: {
      kicker: "2 · The solution",
      title: "One account replaces the bank, the card platform and the lender that SMEs juggle today",
      columns: [
        { icon: "zap", label: "Credit", title: "Approved in five minutes", bullets: ["Limits up to **£250k**, spend the same day", "Underwritten on live Shopify and ad-account data, not filed accounts"] },
        { icon: "wallet", label: "Cashflow", title: "Run cashflow in one place", bullets: ["Pay bills, get paid and control team spend", "Move between debit and credit funds per payment"] },
        { icon: "refresh-cw", label: "Rewards", title: "Earn on every pound", bullets: ["**1% cashback** on all card spend", "Rewards attract transactors, lowering adverse selection"] },
      ],
      takeaway: "Today this takes a bank, a card platform and a lender. **FinBridge is all three.**",
    },
    pitch: {
      kicker: "Solution",
      title: "Bank, card and lender. In one app.",
      columns: [
        { icon: "zap", title: "Credit in 5 minutes", text: "Up to £250k." },
        { icon: "wallet", title: "Cashflow in one place", text: "Pay, get paid, control spend." },
        { icon: "refresh-cw", title: "1% back on everything", text: "Rewards bring the right customers." },
      ],
    },
  },
  {
    template: "columns", name: "Columns · 2 compare", section: "Insight",
    consulting: {
      kicker: "4 · The insight",
      title: "Credit-only lenders attract adverse selection; bundling spend and rewards fixes the funnel",
      columns: [
        { icon: "x", tone: "neg", label: "Today", title: "Credit-only offering", bullets: ["Expensive acquisition of desperate borrowers", "Little data visibility beyond filed accounts", "Adverse-selection loop: high risk drives high prices"], chip: "OnDeck, Kabbage, Silvr: hundreds of millions raised, no survivors" },
        { icon: "check", tone: "pos", label: "FinBridge", title: "Account + rewards + credit", bullets: ["Customers arrive for non-credit reasons", "Credit funds the cashflow of a working business", "Positive loop: more data, better pricing, better customers"], chip: "Capital on Tap, YouLend: profitable with the same pairing" },
      ],
    },
    pitch: {
      kicker: "Insight",
      title: "Credit alone attracts the wrong borrowers.",
      columns: [
        { icon: "x", tone: "neg", title: "Credit only", text: "Desperate borrowers, thin data, rising prices." },
        { icon: "check", tone: "pos", title: "Account + rewards + credit", text: "Good businesses arrive first. Credit follows." },
      ],
    },
  },
  {
    template: "table", name: "Table", section: "Business model",
    table: {
      columns: [{ label: "£ / customer / month" }, { label: "Revolver", num: true, hl: true }, { label: "Transactor", num: true }, { label: "Super-transactor", num: true }],
      rows: [
        { cells: ["Share of customers", "40–60%", "40–60%", "~10%"], style: "muted" },
        { cells: ["Interest revenue", { v: "267", sub: "40% APR × £8.0k" }, "—", "—"] },
        { cells: ["Cost of funding", { v: "(53)", sub: "8% × £8.0k" }, { v: "(33)", sub: "8% × £5.0k" }, { v: "(70)", sub: "8% × £10.5k" }] },
        { cells: ["Interchange revenue", { v: "90", sub: "1.8% × £5.0k spend" }, { v: "120", sub: "1.8% × £6.7k" }, { v: "480", sub: "1.8% × £26.7k" }] },
        { cells: ["Cost of rewards", "(50)", "(67)", "(267)"] },
        { cells: ["Bad debt", { v: "(70)", sub: "~10% of balance p.a." }, "(5)", "(10)"] },
        { cells: ["Monthly gross margin", "179", "10", "128"], style: "total" },
      ],
    },
    consulting: {
      kicker: "5 · Business model",
      title: "Revolvers carry the margin; super-transactors earn theirs on interchange alone",
      source: "FinBridge model; funding cost assumes 8% warehouse rate.",
    },
    pitch: { kicker: "Business model", title: "Every segment makes money." },
  },
  {

/* ───────────── Renderer: frame + body layouts + slot kinds ───────────── */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/&lt;(\/?)em&gt;/g, "<$1em>");
const pad2 = n => String(n).padStart(2, "0");

function specFor(slide, style) {
  const { consulting, pitch, name, ...shared } = slide;
  return { ...shared, ...(style === "pitch" ? pitch : consulting) };
}

function colHTML(c) {
  return `<div class="col tile ${c.tone || ""}">
    ${c.icon ? `<div class="icon"><i data-lucide="${c.icon}"></i></div>` : ""}
    ${c.stat ? `<div class="stat">${esc(c.stat)}</div>` : ""}
    ${c.label ? `<div class="label">${esc(c.label)}</div>` : ""}
    ${c.title ? `<h3>${md(c.title)}</h3>` : ""}
    ${c.text ? `<p>${md(c.text)}</p>` : ""}
    ${c.bullets ? `<ul>${c.bullets.map(b => `<li>${md(b)}</li>`).join("")}</ul>` : ""}
    ${c.chip ? `<div class="foot"><span class="chip">${md(c.chip)}</span></div>` : ""}
  </div>`;
}

function tableHTML(t) {
  const cell = (c, i) => {
    const col = t.columns[i];
    const v = typeof c === "object" ? c : { v: c };
    const cls = [col.num ? "num" : "", col.hl ? "hl" : ""].join(" ");
    return `<td class="${cls}">${col.num ? `<span>${esc(v.v)}</span>` : esc(v.v)}${v.sub ? `<small>${esc(v.sub)}</small>` : ""}</td>`;
  };
  return `<div class="tbl-wrap tile"><table class="tbl">
    <thead><tr>${t.columns.map(c => `<th class="${c.num ? "num" : ""} ${c.hl ? "hl" : ""}">${esc(c.label)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr class="${r.style || ""}">${r.cells.map(cell).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function bodyHTML(s) {
  switch (s.template) {
    case "statement": return s.subtitle ? `<p class="subtitle">${md(s.subtitle)}</p>` : "";
    case "split": return `
      <div class="main tile"><div class="chart" data-chart></div></div>
      <aside class="comments tile">
        <div class="comments-label">What this shows</div>
        ${s.comments.map((c, i) => `<div class="comment"><span class="marker">${i + 1}</span><div><h4>${md(c.title)}</h4>${c.text ? `<p>${md(c.text)}</p>` : ""}</div></div>`).join("")}
      </aside>`;
    case "columns": return `<div class="cols n-${s.columns.length}">${s.columns.map(colHTML).join("")}</div>`;
    case "table": return tableHTML(s.table);
    case "chart": return `<div class="main tile"><div class="chart" data-chart></div></div>`;
  }
  return "";
}

function slideHTML(s, i) {
  if (s.template === "cover") return `<section class="slide t-cover">
      <div class="kicker">${md(s.kicker)}</div>
      <h1 class="cover-title">${esc(s.title)}</h1>
      <p class="cover-sub">${md(s.subtitle)}</p>
      <footer class="cover-meta">${s.meta.map(m => `<span>${esc(m)}</span>`).join("")}</footer>
    </section>`;
  return `<section class="slide t-${s.template}">
    <header class="chrome"><span class="deck">${DECK}</span><span>${esc(s.section || "")} · ${pad2(i + 1)}</span></header>
    ${s.kicker ? `<div class="kicker">${md(s.kicker)}</div>` : ""}
    <h2 class="headline">${md(s.title)}</h2>
    <div class="body">${bodyHTML(s)}</div>
    ${s.takeaway ? `<p class="takeaway"><span>${md(s.takeaway)}</span></p>` : ""}
    ${s.source ? `<p class="source">Source: ${md(s.source)}</p>` : ""}
  </section>`;
}

/* ───────────── Chart component: bar / line / combo, dual axis, anchored markers ───────────── */
function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
const fmt = (tpl, v) => tpl.replace("{v}", Number.isInteger(v) ? v : v.toFixed(1));

function drawChart(host, spec) {
  const legend = spec.series.map(s =>
    `<span class="lg c-${s.color}"><i class="sw ${s.kind} ${s.dashed ? "dashed" : ""}"></i>${esc(s.name)}</span>`).join("");
  host.innerHTML = `<div class="legend">${legend}</div><div class="plot"></div>`;
  const box = host.querySelector(".plot");
  const W = box.clientWidth, H = box.clientHeight;
  const L = spec.series.filter(s => s.axis !== "right"), R = spec.series.filter(s => s.axis === "right");
  const lStep = niceStep(Math.max(...L.flatMap(s => s.values)) / 4);
  const count = Math.ceil(Math.max(...L.flatMap(s => s.values)) / lStep);
  const scale = { left: { max: lStep * count, step: lStep } };
  if (R.length) { const rs = niceStep(Math.max(...R.flatMap(s => s.values)) / count); scale.right = { max: rs * count, step: rs }; }
  const markers = spec.markers || [];
  const P = { t: markers.length ? 64 : 20, r: R.length ? 84 : spec.endLabels ? 120 : 12, b: 48, l: 84 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b, n = spec.categories.length, band = pw / n;
  const y = (v, a = "left") => P.t + ph - (v / scale[a].max) * ph;
  const xc = i => P.l + band * i + band / 2;
  const bars = spec.series.filter(s => s.kind === "bar");
  const gw = band * (bars.length > 1 ? 0.62 : 0.46), bw = gw / Math.max(bars.length, 1);
  const pos = [];
  let g = "";

  for (let k = 0; k <= count; k++) {
    const yy = y(scale.left.step * k);
    g += `<line class="${k ? "grid" : "zero"}" x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}"/>`;
    g += `<text class="tick" x="${P.l - 16}" y="${yy + 6}" text-anchor="end">${fmt(spec.axes.left, scale.left.step * k)}</text>`;
    if (scale.right) g += `<text class="tick" x="${W - P.r + 16}" y="${yy + 6}">${fmt(spec.axes.right, scale.right.step * k)}</text>`;
  }
  spec.categories.forEach((c, i) => g += `<text class="cat" x="${xc(i)}" y="${P.t + ph + 36}" text-anchor="middle">${esc(c)}</text>`);

  spec.series.forEach((s, si) => {
    const a = s.axis === "right" ? "right" : "left";
    if (s.kind === "bar") {
      const j = bars.indexOf(s);
      pos[si] = s.values.map((v, i) => {
        const x = xc(i) - gw / 2 + j * bw + 3, top = y(v, a);
        g += `<rect class="bar c-${s.color}" x="${x}" y="${top}" width="${bw - 6}" height="${Math.max(y(0, a) - top, 0)}"/>`;
        return [x + (bw - 6) / 2, top];
      });
    }
  });
  spec.series.forEach((s, si) => {
    if (s.kind !== "line") return;
    const a = s.axis === "right" ? "right" : "left";
    const pts = s.values.map((v, i) => [xc(i), y(v, a)]);
    pos[si] = pts;
    const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join("");
    if (s.area) g += `<path class="area c-${s.color}" d="${d}L${pts.at(-1)[0]},${y(0)}L${pts[0][0]},${y(0)}Z"/>`;
    g += `<path class="line c-${s.color} ${s.dashed ? "dashed" : ""}" d="${d}"/>`;
    const [lx, ly] = pts.at(-1);
    g += `<circle class="dot c-${s.color}" cx="${lx}" cy="${ly}" r="9"/>`;
    if (spec.endLabels) g += `<text class="endlabel c-${s.color}" x="${lx + 20}" y="${ly + 8}">${fmt(spec.axes.left, s.values.at(-1))}</text>`;
  });
  markers.forEach(m => {
    const [px, py] = pos[m.series][m.index], cy = py - 40;
    g += `<line class="leader" x1="${px}" x2="${px}" y1="${cy + 20}" y2="${py - 6}"/>`;
    g += `<circle class="mk" cx="${px}" cy="${cy}" r="20"/><text class="mk-t" x="${px}" y="${cy + 1}">${m.n}</text>`;
  });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ───────────── Review page ───────────── */
const q = new URLSearchParams(location.search);
const state = { style: q.get("style") || "both", theme: q.get("theme") || "dark" };
document.querySelectorAll(".seg button").forEach(b =>
  b.setAttribute("aria-pressed", b.dataset.style === state.style || b.dataset.theme === state.theme));
const list = document.getElementById("list");

function frameHTML(style) {
  return `<div class="frame-wrap">${state.style === "both" ? `<div class="frame-label">${style}</div>` : ""}
    <div class="frame theme-${state.theme} style-${style}" data-style="${style}"></div></div>`;
}

function render() {
  document.body.className = state.theme === "dark" ? "page-dark" : "";
  const styles = state.style === "both" ? ["consulting", "pitch"] : [state.style];
  list.innerHTML = SLIDES.map((sl, i) => `
    <figure data-i="${i}">
      <figcaption><span class="id">${pad2(i + 1)} · ${sl.template}</span><b>${sl.name}</b></figcaption>
      <div class="frames ${styles.length > 1 ? "two" : ""}">${styles.map(frameHTML).join("")}</div>
      <details><summary>Agent output (JSON)</summary>
        <pre>${esc(JSON.stringify(styles.length > 1 ? sl : specFor(sl, styles[0]), null, 2))}</pre></details>
    </figure>`).join("");

  list.querySelectorAll("figure").forEach(fig => {
    const slide = SLIDES[+fig.dataset.i];
    fig.querySelectorAll(".frame").forEach(fr => {
      const spec = specFor(slide, fr.dataset.style);
      fr.innerHTML = slideHTML(spec, +fig.dataset.i);
      const host = fr.querySelector("[data-chart]");
      if (host) drawChart(host, { ...spec.chart, markers: spec.markers });
      ro.observe(fr);
    });
  });
  lucide.createIcons({ attrs: { "stroke-width": 1.6 } });
}

const ro = new ResizeObserver(entries => entries.forEach(e =>
  e.target.firstElementChild?.style.setProperty("--s", e.contentRect.width / 1920)));

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  const key = b.dataset.style ? "style" : "theme";
  state[key] = b.dataset[key];
  b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

document.fonts.ready.then(render);
</script>
</body>
