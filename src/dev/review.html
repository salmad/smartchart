<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slide review · Occam dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=block" rel="stylesheet" />
<style>
/* Review page chrome (not part of the product). */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #050404; color: #EDE8DE; font-family: "Geist", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between;
  padding: 18px 32px; backdrop-filter: blur(16px); background: rgba(5,4,4,.85); border-bottom: 1px solid rgba(255,255,255,.07); }
.top h1 { font-size: 17px; font-weight: 600; }
.top p { font-size: 14px; opacity: .6; margin-top: 3px; }
.top a { color: inherit; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(255,255,255,.08); }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; opacity: .65; }
.seg button[aria-pressed="true"] { background: #F3EEE4; color: #0B0A09; opacity: 1; }
.seg button:focus-visible { outline: 2px solid #E8B94A; outline-offset: 2px; }
.summary { font: 500 13px/1 "Geist Mono", monospace; opacity: .8; }
main { max-width: 1480px; margin: 0 auto; padding: 32px 32px 120px; display: grid; gap: 56px; }
figure { display: grid; gap: 14px; }
figcaption { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
figcaption .id { font: 500 13px/1 "Geist Mono", monospace; opacity: .5; }
figcaption b { font-size: 16px; font-weight: 600; }
.badge { font: 500 12px/1 "Geist Mono", monospace; padding: 4px 8px; border-radius: 6px; background: rgba(123,216,143,.14); color: #7BD88F; }
.badge.bad { background: rgba(255,90,69,.16); color: #FF7A68; }
.badge.warn { background: rgba(232,185,74,.16); color: #E8B94A; }
.frames { display: grid; gap: 20px; }
.frames.two { grid-template-columns: 1fr 1fr; }
.frame-wrap { display: grid; gap: 8px; }
.frame-label { font: 500 12px/1 "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; outline: 1px solid rgba(255,255,255,.08); }
details { font-size: 13px; }
details summary { cursor: pointer; opacity: .6; font-weight: 500; }
details pre { margin-top: 10px; padding: 16px 18px; border-radius: 12px; overflow: auto; max-height: 420px; font: 12.5px/1.55 "Geist Mono", monospace; background: rgba(255,255,255,.06); white-space: pre-wrap; }
.issues { margin-top: 8px; display: grid; gap: 4px; font: 12.5px/1.5 "Geist Mono", monospace; color: #FF7A68; }
.issues .w { color: #E8B94A; }
/* Phones: one slide per row, no sticky header, no developer panels. */
@media (max-width: 700px) {
  .top { position: static; padding: 16px; gap: 12px; }
  main { padding: 20px 16px 64px; gap: 40px; }
  .frames.two { grid-template-columns: 1fr; gap: 16px; }
  .frame { border-radius: 8px; }
  main > details, figure details { display: none; }
  figcaption .id { display: none; }
}
body.full .top, body.full figcaption, body.full details, body.full .frame-label, body.full .issues { display: none; }
body.full main { max-width: none; padding: 0; gap: 0; }
body.full .frame { border-radius: 0; outline: 0; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Slide system · v5 · 7-entry menu</h1>
    <p>chart · table · number · steps · cards · cover · section. Every slide renders from the JSON under it, is validated by <code>schema.ts</code> and measured for overflow. <a href="?stress=1">Stress deck</a></p>
  </div>
  <div class="controls">
    <span class="summary" id="summary"></span>
    <div class="seg" role="group" aria-label="Writing style" data-key="style">
      <button data-v="both">Side by side</button><button data-v="consulting">Consulting</button><button data-v="pitch">Pitch</button>
    </div>
    <div class="seg" role="group" aria-label="Palette" data-key="theme">
      <button data-v="ink">Ink</button><button data-v="paper">Paper</button>
    </div>
  </div>
</header>
<main id="list"></main>

<script type="module" src="./review.ts"></script>
</body>
</html>
